services:
  probe:
    image: python:3.13-slim
    command: [python, /probe.py]
    environment:
      BASE_URL: ${BASE_URL:-http://app:8080}
      LAB_TOKEN: ${LAB_TOKEN:?Set LAB_TOKEN}
      GOOGLE_ID_TOKEN: ${GOOGLE_ID_TOKEN:-}
    volumes: ["./ops/probe.py:/probe.py:ro"]
  prometheus:
    image: prom/prometheus:latest
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./observability/alerts.yml:/etc/prometheus/alerts.yml:ro"]
  grafana:
    image: grafana/grafana:latest
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD locally}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes: ["./observability/provisioning:/etc/grafana/provisioning:ro", "./observability/dashboard.json:/var/lib/grafana/dashboards/rail.json:ro"]
